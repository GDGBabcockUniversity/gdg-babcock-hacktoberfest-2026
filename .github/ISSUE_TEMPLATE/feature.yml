name: Feature request
description: Propose a focused contributor task
body:
  - type: textarea
    id: context
    attributes:
      label: Context
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use a checklist that can be reviewed
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: hints
    attributes:
      label: Hints

